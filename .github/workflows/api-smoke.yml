name: API smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: api-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Deploy production' && github.ref != 'refs/heads/main' }}

jobs:
  api-smoke:
    name: API smoke (Postgres + uvicorn)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    env:
      APP_ENV: development
      JWT_SECRET: ci-only-not-a-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
      GEMINI_API_KEY: ""
      GOOGLE_PLACES_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Start API server
        run: uvicorn main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
      - name: Exercise API
        run: python scripts/smoke_api.py
      - name: Show server log
        if: always()
        run: tail -n 80 "$RUNNER_TEMP/uvicorn.log"
