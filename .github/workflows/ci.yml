name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run frontend tests
        working-directory: client
        run: npm test
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check test formatting and lint
        run: |
          ruff check app/tests
          ruff format --check app/tests
      - name: Run tests with coverage
        env:
          JWT_SECRET: ci-only-not-a-secret
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: 10080
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_ai_hcmc
          GEMINI_API_KEY: ""
          GOOGLE_PLACES_API_KEY: ""
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  postgres-smoke:
    name: Postgres startup smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Postgres migration and seed smoke test
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
        run: python scripts/smoke_db.py
