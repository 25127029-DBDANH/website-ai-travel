name: CI

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Deploy production' && github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run frontend tests
        working-directory: client
        run: npm test
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check test formatting and lint
        run: |
          ruff check app main.py scripts
          ruff format --check app/tests
      - name: Run tests with coverage
        env:
          JWT_SECRET: ci-only-not-a-secret
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: 10080
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_ai_hcmc
          GEMINI_API_KEY: ""
          GOOGLE_PLACES_API_KEY: ""
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  postgres-smoke:
    name: Postgres startup smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Postgres migration and seed smoke test
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
        run: python scripts/smoke_db.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      GEMINI_API_KEY: ""
      VITE_GOOGLE_CLIENT_ID: ci-smoke.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker compose config
        run: docker compose config -q
      - name: Start full stack with docker compose
        run: |
          if ! docker compose up -d --build --wait; then
            docker compose logs --tail=100
            exit 1
          fi
      - name: Verify frontend build-time Google OAuth config
        run: |
          if ! docker compose exec -T client sh -c "grep -R --include='*.js' -q 'ci-smoke.apps.googleusercontent.com' /usr/share/nginx/html/assets"; then
            docker compose logs --tail=100 client
            exit 1
          fi
      - name: Exercise the full stack through the client proxy
        run: |
          if ! python server/scripts/smoke_api.py --base-url http://127.0.0.1:5173 --include-ai-fallback; then
            docker compose logs --tail=100
            exit 1
          fi
      - name: Tear down docker compose
        if: always()
        run: docker compose down -v
