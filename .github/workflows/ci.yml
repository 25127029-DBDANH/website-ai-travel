name: CI

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Deploy production' && github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run frontend tests
        working-directory: client
        run: npm test
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check test formatting and lint
        run: |
          ruff check app main.py scripts
          ruff format --check app/tests scripts
          python -m doctest scripts/smoke_api.py
      - name: Run tests with coverage
        env:
          JWT_SECRET: ci-only-not-a-secret
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: 10080
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_ai_hcmc
          GEMINI_API_KEY: ""
          GOOGLE_PLACES_API_KEY: ""
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.0
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo gitleaks.tgz --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tgz' | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan changed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            range="$BASE..$HEAD"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            range="origin/main..$HEAD"
          else
            range="-1 $HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts="$range"

  postgres-smoke:
    name: Postgres startup smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Postgres migration and seed smoke test
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
        run: python scripts/smoke_db.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -t saigon-guide-server ./server
      - name: Build client image
        run: docker build --build-arg VITE_API_BASE=/ -t saigon-guide-client ./client
      - name: Validate docker compose config
        run: docker compose config -q
      - name: Start db and server with docker compose
        run: |
          if ! docker compose up -d --build --wait db server; then
            docker compose logs --tail=50 server
            exit 1
          fi
      - name: Verify places search endpoint
        run: |
          BODY=$(curl -sS -w "\n%{http_code}" "http://localhost:8000/api/v1/places/search?limit=1")
          STATUS=$(printf '%s' "$BODY" | tail -n1)
          JSON=$(printf '%s' "$BODY" | sed '$d')
          echo "HTTP $STATUS: $JSON"
          if [ "$STATUS" != "200" ]; then
            docker compose logs --tail=50 server
            exit 1
          fi
          if ! printf '%s' "$JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data.get("total", 0) >= 1, f"Expected total >= 1, got {data}"
          results = data.get("results", [])
          assert len(results) >= 1 and results[0].get("name"), f"Expected non-empty results, got {data}"
          '; then
            docker compose logs --tail=50 server
            exit 1
          fi
      - name: Tear down docker compose
        if: always()
        run: docker compose down -v
