name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Deploy production' && github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start backend server and verify readiness
        working-directory: server
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
          GEMINI_API_KEY: ""
          GOOGLE_PLACES_API_KEY: ""
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 < /dev/null &
          python - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          health_url = "http://127.0.0.1:8000/health"
          places_url = "http://127.0.0.1:8000/api/v1/places/search?limit=1"
          last_error = ""
          last_body = ""

          for _ in range(60):
              try:
                  with urllib.request.urlopen(health_url, timeout=3) as resp:
                      last_body = resp.read().decode("utf-8", errors="replace")
                      data = json.loads(last_body)
                      if resp.status == 200 and data.get("status") == "healthy":
                          break
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(1)
          else:
              print(f"Backend /health did not become ready. last_error={last_error} last_body={last_body}", file=sys.stderr)
              sys.exit(1)

          for _ in range(30):
              try:
                  with urllib.request.urlopen(places_url, timeout=5) as resp:
                      last_body = resp.read().decode("utf-8", errors="replace")
                      data = json.loads(last_body)
                      results = data.get("results") or []
                      if resp.status == 200 and int(data.get("total", 0)) >= 1 and results and results[0].get("id"):
                          print(f"Backend ready: /health=healthy, seeded places sample id={results[0]['id']}")
                          sys.exit(0)
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(1)

          print(f"Backend places readiness check failed. last_error={last_error} last_body={last_body}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Install and build frontend
        working-directory: client
        env:
          VITE_USE_BACKEND: "true"
          VITE_API_BASE: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build

      - name: Start frontend preview server and verify readiness
        working-directory: client
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/frontend.log 2>&1 < /dev/null &
          python - <<'PY'
          import sys
          import time
          import urllib.request

          url = "http://127.0.0.1:4173/"
          last_error = ""
          last_body = ""

          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as resp:
                      last_body = resp.read().decode("utf-8", errors="replace")
                      if resp.status == 200 and '<div id="root">' in last_body:
                          print("Frontend preview ready at http://127.0.0.1:4173")
                          sys.exit(0)
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(1)

          print(f"Frontend preview did not become ready. last_error={last_error} last_body={last_body[:500]}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Install E2E dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright test --reporter=list,html,json

      - name: Summarize failed Playwright tests
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p e2e/test-results
          python - <<'PY' > e2e/test-results/e2e-failure.md
          import html
          import json
          import re
          from pathlib import Path

          def first_line(message):
              plain = re.sub(r"\x1b\[[0-9;]*m", "", message)
              return next((line.strip() for line in plain.splitlines() if line.strip()), "Thiếu thông báo lỗi")

          def failed_tests(suite, parents=()):
              titles = (*parents, suite.get("title", ""))
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      if test["status"] == "unexpected":
                          title = " › ".join(filter(None, (*titles, spec["title"])))
                          errors = [e for r in test["results"] for e in r.get("errors", [])]
                          yield title, errors[0].get("message", "") if errors else test["results"][-1]["status"]
              for child in suite.get("suites", []):
                  yield from failed_tests(child, titles)

          path = Path("e2e/test-results/results.json")
          try:
              report = json.loads(path.read_text())
          except (FileNotFoundError, UnicodeDecodeError, json.JSONDecodeError):
              report = {}
          failures = list(failed_tests(report))
          failures.extend(("Playwright", e.get("message", "")) for e in report.get("errors", []))
          print("<!-- e2e-failure -->")
          print("### E2E (Playwright) thất bại\n")
          for title, message in failures[:25]:
              print(f"- <code>{html.escape(first_line(title)[:300])}</code> — "
                    f"<code>{html.escape(first_line(message)[:500])}</code>")
          if len(failures) > 25:
              print(f"\nCòn {len(failures) - 25} lỗi trong báo cáo.")
          if not failures:
              print("Chưa có kết quả từng test. Xem bước lỗi trong nhật ký workflow.")
          PY

      - name: Upload Playwright report and traces on failure
        if: failure()
        id: artifacts
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          if-no-files-found: ignore
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Link failure summary to the artifact
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          cat e2e/test-results/e2e-failure.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf '\n[Report và trace](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "=== Backend log (last 50 lines) ==="
          tail -n 50 /tmp/backend.log 2>/dev/null || echo "(no backend log)"
          echo "=== Frontend preview log (last 50 lines) ==="
          tail -n 50 /tmp/frontend.log 2>/dev/null || echo "(no frontend log)"
