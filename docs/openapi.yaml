openapi: 3.1.0
info:
  title: 🧭 Sài Gòn Guide — AI Travel Planner API
  description: Hợp đồng API được XUẤT TỰ ĐỘNG từ FastAPI (GET /openapi.json) ngày 22/11/2026 — nguồn sự thật là code trong
    server/app. Cập nhật lại bằng lệnh trong README khi đổi endpoint.
  version: 2.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
    delete:
      tags:
      - auth
      summary: Delete Account
      operationId: delete_account_api_v1_auth_me_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/trips/:
    post:
      tags:
      - trips
      summary: Create Trip
      operationId: create_trip_api_v1_trips__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/trips/me:
    get:
      tags:
      - trips
      summary: List My Trips
      operationId: list_my_trips_api_v1_trips_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/trips/demo:
    get:
      tags:
      - trips
      summary: Get Demo Trip
      description: Public, read-only demo itinerary; no user or database row is required.
      operationId: get_demo_trip_api_v1_trips_demo_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailOut'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - trips
      summary: Get Trip
      operationId: get_trip_api_v1_trips__trip_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - trips
      summary: Update Trip
      operationId: update_trip_api_v1_trips__trip_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - trips
      summary: Delete Trip
      operationId: delete_trip_api_v1_trips__trip_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/items/{day_number}/{order_index}:
    patch:
      tags:
      - trips
      summary: Update Trip Item
      description: Persist a stop's visited state and check-in note/photo.
      operationId: update_trip_item_api_v1_trips__trip_id__items__day_number___order_index__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: day_number
        in: path
        required: true
        schema:
          type: integer
          title: Day Number
      - name: order_index
        in: path
        required: true
        schema:
          type: integer
          title: Order Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/clone:
    post:
      tags:
      - trips
      summary: Clone Trip
      operationId: clone_trip_api_v1_trips__trip_id__clone_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/share:
    post:
      tags:
      - trips
      summary: Create Share Link
      operationId: create_share_link_api_v1_trips__trip_id__share_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - trips
      summary: Revoke Share Link
      operationId: revoke_share_link_api_v1_trips__trip_id__share_delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/shared/{token}:
    get:
      tags:
      - trips
      summary: Get Shared Trip
      operationId: get_shared_trip_api_v1_trips_shared__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/shared/{token}/clone:
    post:
      tags:
      - trips
      summary: Clone Shared Trip
      operationId: clone_shared_trip_api_v1_trips_shared__token__clone_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/places/search:
    get:
      tags:
      - Places
      summary: Tìm kiếm địa điểm TP.HCM
      description: 'Tìm kiếm địa điểm TP.HCM với các bộ lọc linh hoạt.


        - **q**: từ khoá tự do (tên, địa chỉ, tag)

        - **district**: lọc theo quận/huyện

        - **category**: lọc theo loại địa điểm

        - **is_indoor**: `true` = trong nhà (bảo tàng, mall…), `false` = ngoài trời'
      operationId: search_places_endpoint_api_v1_places_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Từ khoá tìm kiếm (tên địa điểm / mô tả)
          title: Q
        description: Từ khoá tìm kiếm (tên địa điểm / mô tả)
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Lọc theo quận/huyện, vd: "Quận 1"'
          title: District
        description: 'Lọc theo quận/huyện, vd: "Quận 1"'
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Loại địa điểm: attraction | food | culture | shopping | park | entertainment'
          title: Category
        description: 'Loại địa điểm: attraction | food | culture | shopping | park | entertainment'
      - name: is_indoor
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Lọc địa điểm trong nhà (True/False)
          title: Is Indoor
        description: Lọc địa điểm trong nhà (True/False)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Số kết quả tối đa mỗi trang
          default: 20
          title: Limit
        description: Số kết quả tối đa mỗi trang
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Vị trí bắt đầu phân trang
          default: 0
          title: Offset
        description: Vị trí bắt đầu phân trang
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/places/nearby:
    get:
      tags:
      - Places
      summary: Tìm địa điểm lân cận trong bán kính
      description: 'Tìm địa điểm lân cận dựa trên toạ độ GPS và bán kính.

        Phục vụ tính năng **Đổi địa điểm (Swap Place)** — gợi ý 2-3 điểm tương đương.'
      operationId: get_nearby_places_endpoint_api_v1_places_nearby_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          description: Vĩ độ trung tâm
          title: Lat
        description: Vĩ độ trung tâm
      - name: lng
        in: query
        required: true
        schema:
          type: number
          description: Kinh độ trung tâm
          title: Lng
        description: Kinh độ trung tâm
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          maximum: 20.0
          minimum: 0.1
          description: Bán kính tìm kiếm (km)
          default: 2.0
          title: Radius Km
        description: Bán kính tìm kiếm (km)
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo loại địa điểm
          title: Category
        description: Lọc theo loại địa điểm
      - name: is_indoor
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Lọc trong nhà / ngoài trời
          title: Is Indoor
        description: Lọc trong nhà / ngoài trời
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/places/photo:
    get:
      tags:
      - Places
      summary: Proxy ảnh từ Google Places API (giữ API key phía server)
      description: 'Backend proxy that fetches a Google Places photo and streams it to the

        client.  The `GOOGLE_PLACES_API_KEY` is **never** exposed in the response

        body, HTTP headers, or browser history.'
      operationId: proxy_google_place_photo_api_v1_places_photo_get
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          description: Google Places photo resource name
          title: Name
        description: Google Places photo resource name
      - name: max_width
        in: query
        required: false
        schema:
          type: integer
          maximum: 4800
          minimum: 100
          description: Chiều rộng ảnh tối đa (px)
          default: 800
          title: Max Width
        description: Chiều rộng ảnh tối đa (px)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/places/{place_id}:
    get:
      tags:
      - Places
      summary: Chi tiết một địa điểm
      description: 'Trả về thông tin chi tiết của một địa điểm theo UUID.


        Nếu `enrich=true` (mặc định), hệ thống sẽ gọi **Google Places API (New)**

        để lấy rating, ảnh và giờ mở cửa thực tế.  Nếu API không khả dụng, dữ liệu

        cục bộ được dùng làm fallback mà không ảnh hưởng trải nghiệm người dùng.'
      operationId: get_place_detail_api_v1_places__place_id__get
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          title: Place Id
      - name: enrich
        in: query
        required: false
        schema:
          type: boolean
          description: Có làm phong phú dữ liệu từ Google Places API không?
          default: true
          title: Enrich
        description: Có làm phong phú dữ liệu từ Google Places API không?
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/concept:
    post:
      tags:
      - AI
      summary: Đề xuất concept chuyến đi
      operationId: suggest_trip_concept_api_v1_ai_concept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripConceptRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/generate:
    post:
      tags:
      - AI
      summary: Tạo lịch trình chi tiết
      operationId: generate_trip_itinerary_api_v1_ai_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripGenerationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripGenerationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ai/swap:
    post:
      tags:
      - AI
      summary: Gợi ý địa điểm thay thế
      operationId: suggest_place_swaps_api_v1_ai_swap_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartSwapRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartSwapResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transit/estimate:
    post:
      tags:
      - Transit & Adaptive
      summary: Ước tính quãng đường, thời gian và cước 3 hãng xe (Grab / Xanh SM / Be)
      operationId: estimate_transit_api_v1_transit_estimate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitEstimateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitEstimateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transit/adapt:
    post:
      tags:
      - Transit & Adaptive
      summary: Áp dụng kịch bản thích ứng trời mưa & giờ cao điểm cho lịch trình
      operationId: adapt_itinerary_api_v1_transit_adapt_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitAdaptRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitAdaptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AuthResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserOut'
        token:
          type: string
          title: Token
        claimed_trips:
          type: integer
          title: Claimed Trips
          default: 0
      type: object
      required:
      - user
      - token
      title: AuthResponse
    BudgetSummary:
      properties:
        total_budget:
          type: integer
          title: Total Budget
          default: 0
        total_estimated:
          type: integer
          title: Total Estimated
          default: 0
        activities_cost:
          type: integer
          title: Activities Cost
          default: 0
        transit_cost:
          type: integer
          title: Transit Cost
          default: 0
        member_count:
          type: integer
          title: Member Count
          default: 1
        per_person_estimated:
          type: integer
          title: Per Person Estimated
          default: 0
        percentage:
          type: integer
          title: Percentage
          default: 0
        health:
          type: string
          title: Health
          default: under_budget
      type: object
      title: BudgetSummary
    CloneResponse:
      properties:
        id:
          type: string
          title: Id
        trip:
          $ref: '#/components/schemas/TripOut'
      type: object
      required:
      - id
      - trip
      title: CloneResponse
    ConceptResponse:
      properties:
        summary:
          type: string
          title: Summary
        highlights:
          items:
            type: string
          type: array
          title: Highlights
        recommended_districts:
          items:
            type: string
          type: array
          title: Recommended Districts
        route_overview:
          type: string
          title: Route Overview
        confirmation_question:
          type: string
          title: Confirmation Question
      type: object
      required:
      - summary
      - highlights
      - recommended_districts
      - route_overview
      - confirmation_question
      title: ConceptResponse
      description: Concept AI trả về trước khi tạo lịch trình chi tiết.
    DeleteAccountRequest:
      properties:
        password:
          type: string
          title: Password
      type: object
      required:
      - password
      title: DeleteAccountRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ItineraryItemResponse:
      properties:
        place_id:
          type: string
          title: Place Id
        place_name:
          type: string
          title: Place Name
        category:
          type: string
          title: Category
        description:
          type: string
